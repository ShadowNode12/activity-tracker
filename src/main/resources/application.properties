spring.application.name=activitytracker

spring.datasource.url=jdbc:mysql://localhost:3306/activitytracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration


ai.coach.quota.per-user-daily-limit=5
ai.coach.quota.global-daily-limit=100
ai.coach.quota.time-zone=Asia/Kolkata
